<title>Urban Court — One-Time Menu Import</title>
<style>
  :root{--bg:#0c0906;--card:#121110;--orange:#ed8530;--cream:#f0e4d0;--muted:#7a6550;}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--cream);font-family:-apple-system,Segoe UI,Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
  .box{background:var(--card);border:1px solid rgba(237,133,48,.25);border-radius:12px;
       padding:36px;max-width:440px;width:100%}
  h1{font-size:19px;margin:0 0 6px;color:var(--cream)}
  p.sub{color:var(--muted);font-size:13px;margin:0 0 26px}
  input{width:100%;padding:11px 12px;margin-bottom:12px;background:#1a1815;
        border:1px solid rgba(237,133,48,.25);border-radius:6px;color:var(--cream);font-size:14px}
  input:focus{outline:none;border-color:var(--orange)}
  button{width:100%;padding:12px;border:none;border-radius:6px;font-size:14px;font-weight:600;
         cursor:pointer;margin-top:6px}
  #signInBtn{background:var(--orange);color:#0c0906}
  #importBtn{background:var(--orange);color:#0c0906;display:none}
  #importBtn:disabled{opacity:.5;cursor:default}
  #log{margin-top:18px;font-size:12.5px;color:var(--muted);max-height:220px;overflow-y:auto;
       white-space:pre-wrap;line-height:1.6}
  .ok{color:#7ed492}
  .err{color:#e26a6a}
  .status{margin-top:14px;font-size:13px;color:#7ed492;display:none}
</style>
</head>

  const logEl = document.getElementById('log');
  function log(msg, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  document.getElementById('signInBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) { log('Enter your admin email and password.', 'err'); return; }
    try {
      await signInWithEmailAndPassword(auth, email, password);
      document.getElementById('loginStep').style.display = 'none';
      const status = document.getElementById('signedInStatus');
      status.style.display = 'block';
      status.textContent = 'Signed in as ' + email;
      document.getElementById('importBtn').style.display = 'block';
      log('Signed in successfully. Click "Import" to write the 51 drinks.');
    } catch (err) {
      log('Sign-in failed: ' + err.message, 'err');
    }
  });

  document.getElementById('importBtn').addEventListener('click', async () => {
    const btn = document.getElementById('importBtn');
    btn.disabled = true;
    btn.textContent = 'Importing...';
    try {
      const batch = writeBatch(db);
      DRINKS.forEach((item) => {
        const ref = doc(db, 'drinks', item.id);
        batch.set(ref, item);
      });
      await batch.commit();
      log(`Imported ${DRINKS.length} drinks into Firestore.`, 'ok');
      btn.textContent = 'Done \u2713';
    } catch (err) {
      log('Import failed: ' + err.message, 'err');
      btn.disabled = false;
      btn.textContent = 'Import 51 Drinks to Firestore';
    }
  });
